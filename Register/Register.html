<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HTML Starter</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
 <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.26/angular.min.js"></script>
 <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css">
 <script src="register.js"></script>
  </head>
<body>
 <div ng-app = "myApp" class = "container" style="width:550px">
   <div style="text-align:center;color:blue">
 <h3><b>User Registration Form</b></h3>
   </div>
 <div ng-controller = "ContactController">
   <div align="right">
 
   </div>
   
  <form role = "form" class="well" ng-hide="ifSearchUser" action="store.jsp" method="post">
   
 <div class = "form-group">
 <label for = "name"> Name:  </label>
 <input type = "text" id = "name" class = "form-control" placeholder = "Enter Name " name= "name" ng-model = "newcontact.name">
 </div>
 
 <div class = "form-group">
 <label for = "phone"> Phone:  </label>
 <input type = "text" id = "phone" class = "form-control" placeholder = "Enter Phone " name= "phone" ng-model = "newcontact.phone">
 <span ng-show="form.mobileNum.$dirty && form.mobileNum.$error.required" >Mobile Number is required</span>
 </div>
 
 <div class = "form-group">
 <label for = "address"> Address:  </label>
 <input type = "textarea" id = "address" class = "form-control" placeholder = "Enter Address " name= "address" ng-model = "newcontact.address">
 </div>
 
 <div class = "form-group">
 <label for = "email"> Email:  </label>
 <input type = "email" id = "email" class = "form-control" placeholder = "Enter Email " name= "email" ng-model = "newcontact.email">
 <span ng-show="form.mobileNum.$dirty && form.mobileNum.$error.required" >Email is required</span>
 </div>
 
 <div class = "form-group">
 <label for = "username"> Username:  </label>
 <input type = "username" id = "username" class = "form-control" placeholder = "Username " name= "username" ng-model = "newcontact.username">
 <span ng-show="form.mobileNum.$dirty && form.mobileNum.$error.required" >Username is required</span>
 </div>
 
 <div class = "form-group">
 <label for = "password"> Password:  </label>
 <input type = "password" id = "password" class = "form-control" placeholder = "Enter Password " name= "password" ng-model = "newcontact.password">
 <span ng-show="form.mobileNum.$dirty && form.mobileNum.$error.required" >Password is required</span>
 </div>
 
 <div class = "form-group">
 <label for = "re-password"> Re-Enter Password:  </label>
 <input type = "password" id = "re-password" class = "form-control" placeholder = "Re-Enter Password " name= "re-password" ng-model = "newcontact.re-password">
 </div>
  
 <br>
 <input type="hidden" ng-model="newcontact.id">
 <div class="form-actions">
 <input type="submit" class="btn btn-primary" ng-click="saveContact()" value = "Register">
 <input type="reset" name="" value="Clean">
 <a href="#/">Cancel</a>
 </div>
   </form>
 
   
 </div>
 </div>
</body>
</html>
   </form>
 
   
 </div>
 </div>
</body>
</html>
